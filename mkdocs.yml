site_name: Habitable Life
site_url: https://tim-welch.github.io/blog-material

theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: fontawesome/solid/book-bible
  # favicon: assets/favicon.ico
  features:
    - navigation.footer
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    # - navigation.tabs
    - toc.follow
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: deep orange
      accent: deep purple

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: deep orange
      accent: deep purple

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - admonition
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: true
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/timothyewelch
    - icon: fontawesome/solid/blog
      link: https://tim-welch.github.io/habitablelife

extra_css:
  - stylesheets/backlinks-admonition.css

copyright: Copyright &copy; 2025 Timothy Welch

plugins:
  - search
  - blog:
      blog_dir: .
      post_dir: "{blog}/notes"
      blog_toc: true
      post_date_format: full
      post_url_format: "note/{slug}"
  - meta
  - backlinks_section:
      title: Linked mentions
      ignore_links_to:
      - index.md
#nav:
#  - Home: index.md
#  - Maps of Content:
#    - Examples: maps/examples.md
